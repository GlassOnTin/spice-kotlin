[toolchain]
# Pinned (not "stable") so the compiler that builds the shipped SPICE .so is
# deterministic. A directory-scoped rust-toolchain.toml overrides the global
# `rustup default`. spice-client's `image` 0.25.10 dependency requires
# rustc >= 1.88, so anything older hard-errors. rdp-kotlin has moved on to
# 1.94.1 (forced by its git-pinned IronRDP); nothing here needs that, and a
# directory-scoped toml means the two can differ without interfering.
channel = "1.89.0"
targets = ["aarch64-linux-android", "x86_64-linux-android", "armv7-linux-androideabi"]
